[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experiment-agents"
version = "0.1.0"
description = "按作品隔离的实验 API 与显式模型流程"
requires-python = ">=3.12,<3.13"
dependencies = ["agno>=2.9,<3", "fastapi>=0.115,<1", "pydantic>=2.11,<3", "openai>=2,<3", "uvicorn>=0.34,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
