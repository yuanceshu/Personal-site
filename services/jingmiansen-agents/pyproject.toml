[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jingmiansen-agents"
version = "0.1.0"
description = "静眠森角色智能体的 AgentOS 服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agno[os]>=2.1,<3",
  "openai>=1,<3",
  "psycopg[binary]>=3,<4",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jingmiansen_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "app.py"
